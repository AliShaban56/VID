<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حكاية — استوديو الفيديو</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e7eaf5;font-family:system-ui,Arial}header{padding:25px 8%;border-bottom:1px solid #25304b}main{max-width:1100px;margin:30px auto;padding:20px}.panel{background:#151d33;border:1px solid #293653;border-radius:16px;padding:24px;margin:18px 0}textarea,input{width:100%;padding:14px;background:#0c1428;color:white;border:1px solid #33415e;border-radius:10px;margin:10px 0}button{background:#7765e8;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.muted{color:#9eabc5}.status{padding:10px;border-radius:8px;background:#202b45}.preview{max-width:100%;border-radius:12px;margin-top:12px}</style></head><body><header><h1>حكاية — استوديو القصص والفيديو</h1><p class="muted">المفتاح يُدار على السيرفر وليس في المتصفح.</p></header><main><section class="panel"><h2>حالة الاتصال</h2><div id="status" class="status">جارٍ التحقق...</div><p class="muted">Vercel Environment Variables: AGNES_API_KEY و AGNES_API_BASE_URL ثم أعد النشر.</p></section><section class="panel"><h2>القصة</h2><textarea id="story" rows="9" placeholder="اكتب فكرتك أو قصتك..."></textarea><button onclick="split()">تقسيم لمشاهد</button><button onclick="save()">حفظ محلي</button></section><section class="panel"><h2>المشاهد</h2><div id="scenes" class="grid"></div></section><section class="panel"><h2>توليد صورة</h2><textarea id="prompt" rows="4" placeholder="وصف المشهد"></textarea><button onclick="generate()">توليد صورة</button><div id="result"></div><p id="msg" class="muted"></p></section></main><script>const se=document.getElementById('status');async function check(){try{let r=await fetch('/api/status'),j=await r.json();se.textContent=j.configured?'المفتاح وعنوان المزود مُعدّان على السيرفر.':'لم يتم إعداد المفتاح وعنوان المزود.'}catch{se.textContent='تعذر التحقق.'}}function esc(x){return x.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}function split(){let p=document.getElementById('story').value.trim().split(/[.!?؟\\n]+/).filter(x=>x.trim());document.getElementById('scenes').innerHTML=p.map((x,i)=>'<div class="panel"><b>مشهد '+(i+1)+'</b><p>'+esc(x)+'</p><button onclick="pick('+JSON.stringify(x).replace(/</g,'\\u003c')+')">استخدم الوصف</button></div>').join('')||'اكتب القصة أولاً'}function pick(x){document.getElementById('prompt').value=x}function save(){localStorage.setItem('hekaya_story',document.getElementById('story').value);alert('تم الحفظ')}async function generate(){let p=document.getElementById('prompt').value.trim(),m=document.getElementById('msg'),o=document.getElementById('result');if(!p){m.textContent='اكتب وصفًا أولاً';return}m.textContent='جارٍ التوليد...';o.innerHTML='';try{let r=await fetch('/api/generate-image',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt:p})}),j=await r.json();if(!r.ok)throw Error(j.error||'فشل');if(j.imageUrl)o.innerHTML='<img class="preview" src="'+esc(j.imageUrl)+'">';else o.textContent=JSON.stringify(j,null,2);m.textContent='تم.'}catch(e){m.textContent=e.message}}document.getElementById('story').value=localStorage.getItem('hekaya_story')||'';check();</script></body></html>
