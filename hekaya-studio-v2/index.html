<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حكاية — استوديو الفيديو</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e7eaf5;font-family:system-ui,Arial}header{padding:25px 8%;border-bottom:1px solid #25304b}main{max-width:1100px;margin:30px auto;padding:20px}.panel{background:#151d33;border:1px solid #293653;border-radius:16px;padding:24px;margin:18px 0}h1{font-size:32px}textarea,input{width:100%;padding:14px;background:#0c1428;color:white;border:1px solid #33415e;border-radius:10px;margin:10px 0}button{background:#7765e8;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.muted{color:#9eabc5}</style></head><body><header><h1>حكاية <small>استوديو القصص والفيديو</small></h1><p class="muted">مساحة مستقلة داخل VID — نسخة تطويرية</p></header><main><section class="panel"><h2>كتابة القصة</h2><textarea id="story" rows="9" placeholder="اكتب فكرتك أو قصتك هنا..."></textarea><button onclick="split()">تقسيم القصة لمشاهد</button><button onclick="save()">حفظ محلي</button><p class="muted">الحفظ في هذه النسخة يتم داخل المتصفح فقط.</p></section><section class="panel"><h2>المشاهد</h2><div id="scenes" class="grid"></div></section><section class="panel"><h2>إدارة مفاتيح API (واجهة تجريبية)</h2><input id="key" placeholder="أدخل المفتاح — لا تستخدم مفاتيح حقيقية هنا"><button onclick="addKey()">إضافة</button><div id="keys"></div><p class="muted">هذه واجهة نموذجية، لا تحفظ المفاتيح أو تستخدمها في عمليات API حقيقية.</p></section></main><script>let keys=[];function split(){let s=document.getElementById('story').value.trim();let parts=s.split(/[.!?؟\\n]+/).filter(x=>x.trim());document.getElementById('scenes').innerHTML=parts.map((x,i)=>'<div class="panel"><b>مشهد '+(i+1)+'</b><p>'+x.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</p></div>').join('')||'اكتب قصة أولاً'}function save(){localStorage.setItem('hekaya_story',document.getElementById('story').value);alert('تم الحفظ في هذا المتصفح')}function addKey(){let v=document.getElementById('key').value.trim();if(v){keys.push(v);document.getElementById('keys').innerHTML=keys.map((k,i)=>'<p>Key '+(i+1)+' ••••</p>').join('');document.getElementById('key').value=''}}document.getElementById('story').value=localStorage.getItem('hekaya_story')||'';</script></body></html>
